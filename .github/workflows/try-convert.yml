# 試しの変換: .github/try/inputs.txt のローマ字を、main の一式（試験の成果物 linux-bin）で変換して見る（比べ用の枝だけ）。
name: Try convert

on:
  push:
    branches: [work/zenzai-ablation]
    paths: [.github/try/**, .github/workflows/try-convert.yml]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  convert:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: repo
      - uses: actions/download-artifact@v4
        with:
          name: linux-bin
          path: bin
          run-id: "42187436873"
          github-token: ${{ github.token }}
      - name: 変換
        run: |
          set -e
          W=$GITHUB_WORKSPACE; E=$W/bin/engine
          chmod +x $E/session_handler_main
          curl -fsSL -o $W/model.gguf \
            https://github.com/J-KAMMA/compound-ime/releases/download/model-zenz-ft-v5/zenz-v3.2-small-ft-v5-mix-Q5_K_M.gguf
          echo "2f9d9d9679dbd3b38ebd48f402369cc1c66f709bfcf83d70d87ca3353e541fff  $W/model.gguf" | sha256sum -c
          export LD_LIBRARY_PATH="$E${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          bash repo/tools/batch_convert.sh $E/session_handler_main $E $W/model.gguf repo/.github/try/inputs.txt out.tsv 1
          cat out.tsv

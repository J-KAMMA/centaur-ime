# 一般的な IME との比べ: BekiIME（nyk2、Windows 用、元のプログラムは非公開）を使い捨ての Windows の機械に入れて、
# 同じ文をキーで打ち込んで測る。測るだけで配らない。許諾（LICENSE.txt）は「インストールして使う」ことを認めている。
# 調べ（run 44659796301）: Inno Setup。/VERYSILENT で入り、TSF に登録され、日本語の入力方法にも足される。
# ただし最後の知らせの窓（OK）は /SUPPRESSMSGBOXES でも出て待ち続けるので、登録を確かめたら入れる道具を止める。
# 設定は BekiIME の既定のまま（AI 変換は既定で切）。
name: BekiIME measure

on:
  push:
    branches: [work/compare-general]
    paths: [.github/workflows/beki-measure.yml, tools/beki_type.ps1, .github/beki-in.txt]
  workflow_dispatch:
    inputs:
      limit:
        description: "測る文の数（0 は全部）"
        default: "50"

permissions:
  contents: read
  actions: read

env:
  BEKI_URL: https://nyk2.sakura.ne.jp/download_a.php?file=files/BekiIME-0.61.0.805-setup.exe
  BEKI_SHA256: 1714D35523C26FB5D4EA3BA05E7CC05568757D8DADA6722F3CAA0DA65C6C1510
  BEKI_TIP: "0411:{2F677219-B03B-4F12-975D-1B74EFA24FB5}{42CF9977-9B77-45D0-BD23-04C3A688F6B7}"
  # 送ったときに測る文の数（0 は全部）。まず 50 文でキーが届くかを確かめる
  DEFAULT_LIMIT: "50"

jobs:
  measure:
    runs-on: windows-2025
    timeout-minutes: 360
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: 取ってきて入れる
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -Uri $env:BEKI_URL -OutFile $env:RUNNER_TEMP\beki-setup.exe -UserAgent 'Mozilla/5.0'
          if ((Get-FileHash $env:RUNNER_TEMP\beki-setup.exe -Algorithm SHA256).Hash -ne $env:BEKI_SHA256) { throw "SHA256 が違う" }
          $p = Start-Process $env:RUNNER_TEMP\beki-setup.exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-',"/LOG=$env:RUNNER_TEMP\beki-install.log" -PassThru
          for ($i = 0; $i -lt 120 -and -not $p.HasExited; $i++) {
            Start-Sleep 5
            if ((Test-Path $env:RUNNER_TEMP\beki-install.log) -and (Select-String -Path $env:RUNNER_TEMP\beki-install.log -Pattern 'Message box' -Quiet)) { break }
          }
          Start-Sleep 5
          Get-Process | Where-Object { $_.Path -like "$env:RUNNER_TEMP*" -or $_.ProcessName -like 'beki-setup*' -or $_.ProcessName -like 'is-*' } | Stop-Process -Force -ErrorAction SilentlyContinue
          Get-Content $env:RUNNER_TEMP\beki-install.log -Tail 8
          (Get-WinUserLanguageList | Where-Object LanguageTag -eq 'ja').InputMethodTips
          Set-WinDefaultInputMethodOverride -InputTip $env:BEKI_TIP
          Get-WinDefaultInputMethodOverride
      - name: 打ち込む
        run: |
          $limit = '${{ inputs.limit }}'; if (-not $limit) { $limit = $env:DEFAULT_LIMIT }
          New-Item -ItemType Directory -Force out | Out-Null
          Get-Content .github/beki-in.txt -Encoding utf8 | Where-Object { $_ -notmatch '^#' } | Set-Content in.txt -Encoding utf8
          powershell -NoProfile -ExecutionPolicy Bypass -File tools/beki_type.ps1 -In in.txt -Out out/raw-beki.tsv -Limit ([int]$limit)
          (Get-Content out/raw-beki.tsv -Encoding utf8).Count
      - name: 画面を残す
        if: always()
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          New-Item -ItemType Directory -Force out | Out-Null
          $bmp.Save("$PWD\out\screen.png")
          Copy-Item $env:RUNNER_TEMP\beki-install.log out\ -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: beki-measure
          path: out/

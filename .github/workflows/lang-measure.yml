name: More languages measure

# Centaur IME に足す言語の候補を、AI なしの基本で測る（どこまで行けそうかを先に数で見る）。
#   ベトナム語: 声調記号なしで打った文を記号つきに戻す（Tatoeba CC BY 2.0 FR、ウィキペディア CC BY-SA 4.0）
#   ヒンディー語: ローマ字で打った文をデーヴァナーガリーに（Google Dakshina、CC BY-SA 4.0）
# 比べに使う indic_transliteration（MIT）は計測にだけ使う。

on:
  workflow_dispatch:
  push:
    branches: [work/lang-measure]

permissions:
  contents: read

jobs:
  vi:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 材料
        run: |
          set -eo pipefail
          python3 -m pip install -q pyarrow==21.0.0
          curl -fsSL --retry 3 -o vie_sentences.tsv.bz2 https://downloads.tatoeba.org/exports/per_language/vie/vie_sentences.tsv.bz2
          sha256sum vie_sentences.tsv.bz2
          curl -fsSL --retry 3 -o vi.parquet \
            https://huggingface.co/datasets/wikimedia/wikipedia/resolve/b04c8d1ceb2f5cd4588862100d08de323dccfbaa/20231101.vi/train-00002-of-00004.parquet
          echo "f364415cd7ccffc02651843ef2a12a80c5e217a08274b930bc1a1746b544622f  vi.parquet" | sha256sum -c
      - name: 測る
        run: python3 tools/lang_measure/vi_measure.py --tatoeba vie_sentences.tsv.bz2 --wiki vi.parquet --out out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vi-measure
          path: out/
          retention-days: 14

  hi:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 材料（Dakshina 1.0。ヒンディー語の分だけ取り出す）
        run: |
          set -eo pipefail
          python3 -m pip install -q indic_transliteration==2.3.69 || echo "indic_transliteration なし"
          curl -fsSL --retry 3 https://storage.googleapis.com/gresearch/dakshina/dakshina_dataset_v1.0.tar \
            | tar -x --wildcards 'dakshina_dataset_v1.0/hi/*'
          ls -R dakshina_dataset_v1.0/hi | head -30
      - name: 測る
        run: python3 tools/lang_measure/hi_measure.py --dakshina dakshina_dataset_v1.0/hi --out out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hi-measure
          path: out/
          retention-days: 14

  ar:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 材料（Hugging Face の版を固定。測ると表づくりにだけ使い、配らない）
        run: |
          set -eo pipefail
          python3 -m pip install -q pyarrow==21.0.0
          H=https://huggingface.co/datasets
          get() { mkdir -p "data/$1"; curl -fsSL --retry 3 -o "data/$1/$(basename $3)" "$H/$2/resolve/$4/$3"; }
          get arbml arbml/Arabizi_Transliteration data/train-00000-of-00001-600f00d132ab2179.parquet f3ed32688f7442032449fc47e89deeabb74f5b70
          for i in 0 1 2 3 4; do
            get darija elkababi2/Darija-Text-Ar-Arabizi data/train-0000$i-of-00005.parquet 787cfc44a7fdc7a6b615e1fe52c9cb7c52e4fca5
          done
          for f in annotated.jsonl train.json dev.json test.json; do
            get arabizikit rabeeeehh/arabizi-kit-corpus $f 11d51d185cc1dd0f24b43eadff1c8df54291cf04
          done
          for f in data/train-00000-of-00001.parquet data/test-00000-of-00001.parquet; do
            get khanafer akhanafer/arabic-to-arabizi $f f554007a8f59437c3db15923a43f8b40adce82b2
          done
          curl -fsSL --retry 3 -o ar.parquet \
            $H/wikimedia/wikipedia/resolve/b04c8d1ceb2f5cd4588862100d08de323dccfbaa/20231101.ar/train-00004-of-00007.parquet
          echo "f035e9118745d465529d48b0b1893824a4f266af2474694dcd35823e767aad17  ar.parquet" | sha256sum -c
          find data -type f | xargs ls -la
      - name: 測る
        run: python3 tools/lang_measure/ar_measure.py --data data --wiki ar.parquet --out out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ar-measure
          path: out/
          retention-days: 14

# 今の変換が取り違える文を集める（人工知能の学び直しの材料。手動で動く）。
# ウィキペディアの文か、Tatoeba の試験の枠の文（ふだんの文。tools/tatoeba_pool_typing.py）を、tests/conversion の文を除いて
# ローマ字で打ち込み、元の文と違った文を残す。
# 変換の一式は、試験の流れ（linux-test.yml）の成果物 linux-bin を、その run の番号で借りる。
# できたファイルは成果物 mistakes に残る（文はウィキペディア CC BY-SA 4.0、または Tatoeba CC BY 2.0 FR）。
name: Mine mistakes

on:
  # main に入れる前は、この枝に push したときに既定の値で動く
  push:
    branches: [work/mine-homophones, work/mine-tatoeba, work/compare-general, work/zenzai-ablation]
  workflow_dispatch:
    inputs:
      bin_run:
        description: 成果物 linux-bin を借りる試験の run の番号（main の試験）
        required: true
      count:
        description: 文の数（ウィキペディアのとき）
        default: '20000'
      source:
        description: 文の出どころ（wiki か tatoeba）
        default: wiki

permissions:
  contents: read
  actions: read

jobs:
  sentences:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: 材料（版と SHA256 を固定）
        run: |
          set -eo pipefail
          python3 -m venv venv && venv/bin/pip -q install "sudachipy==0.6.11" "sudachidict-core==20260428" "pyarrow==21.0.0"
          if [ "${{ inputs.source || (startsWith(github.ref_name, 'work/') && github.ref_name != 'work/mine-homophones' && 'tatoeba' || 'wiki') }}" = tatoeba ]; then
            # Tatoeba は毎日書き出し直されるので版は固定できない。SHA-256 を記録に残す（試験の枠は文の番号で決まる）。
            curl -fsSL -o jpn_sentences.tsv.bz2 https://downloads.tatoeba.org/exports/per_language/jpn/jpn_sentences.tsv.bz2
            sha256sum jpn_sentences.tsv.bz2
          fi
          curl -fsSL -o wiki.parquet \
            https://huggingface.co/datasets/wikimedia/wikipedia/resolve/b04c8d1ceb2f5cd4588862100d08de323dccfbaa/20231101.ja/train-00011-of-00015.parquet
          echo "271165db78420d9286c82c2b9b93ac520925b41187537ef12bc9ff7ec1a1dca4  wiki.parquet" | sha256sum -c
          curl -fsSL -o romanji-hiragana.tsv \
            https://raw.githubusercontent.com/unok/mozc/2d993fd532c0df849ff3a5f6c7851b3757471ed6/src/data/preedit/romanji-hiragana.tsv
          echo "fcb900e311d32ced05499c86e236d1084fb0c0937398deb6311fc6c7287a7821  romanji-hiragana.tsv" | sha256sum -c
      - name: 文を作って16に分ける
        run: |
          set -eo pipefail
          mkdir -p out
          if [ -f jpn_sentences.tsv.bz2 ]; then
            # 枝への push のときの設定（.github/mine-push.env: PART、CONTAINS、COUNT）
            PART=pool; CONTAINS=""; COUNT=0
            [ -f .github/mine-push.env ] && . .github/mine-push.env
            venv/bin/python tools/tatoeba_pool_typing.py --tatoeba jpn_sentences.tsv.bz2 --table romanji-hiragana.tsv \
              --out out/all.tsv --part $PART --count $COUNT ${CONTAINS:+--contains $CONTAINS}
            # 同音語の組の手がかりの候補（.github/cue-pairs.tsv があるとき）
            if [ -f .github/cue-pairs.tsv ]; then
              venv/bin/python tools/mine_homophone_cues.py --tatoeba jpn_sentences.tsv.bz2 --pairs .github/cue-pairs.tsv \
                --out out/cue-candidates.tsv
            fi
          else
            venv/bin/python tools/wiki_typing_test.py --wiki wiki.parquet --table romanji-hiragana.tsv \
              --out out/all.tsv --count ${{ inputs.count || '20000' }} --seed 20261104
          fi
          grep -v '^#' out/all.tsv > out/body.tsv
          wc -l out/body.tsv
          split -n l/16 -d -a 2 out/body.tsv out/shard-
          ls out
      - uses: actions/upload-artifact@v4
        with:
          name: mine-sentences
          path: out/
          retention-days: 7

  convert:
    needs: sentences
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        shard: ["00","01","02","03","04","05","06","07","08","09","10","11","12","13","14","15"]
        # 変換の一式を借りる run（push のとき。1つ目が比べる元、2つ目が試す枝。workflow_dispatch では bin_run だけ使う）
        bin: ["42187436873", "42178261285"]
        zen: ["on"]
    steps:
      - uses: actions/checkout@v4
        with:
          path: repo
      - uses: actions/download-artifact@v4
        with:
          name: linux-bin
          path: bin
          run-id: ${{ inputs.bin_run || matrix.bin }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: mine-sentences
          path: sentences
      - name: 変換（組 ${{ matrix.shard }}）
        run: |
          set -eo pipefail
          W=$GITHUB_WORKSPACE; E=$W/bin/engine
          chmod +x $E/session_handler_main
          curl -fsSL -o $W/model.gguf \
            https://github.com/J-KAMMA/compound-ime/releases/download/model-zenz-ft-v5/zenz-v3.2-small-ft-v5-mix-Q5_K_M.gguf
          echo "2f9d9d9679dbd3b38ebd48f402369cc1c66f709bfcf83d70d87ca3353e541fff  $W/model.gguf" | sha256sum -c
          export LD_LIBRARY_PATH="$E${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          mkdir -p out
          cut -f1 sentences/shard-${{ matrix.shard }} > in.txt
          # 比べ: 同じ一式で Zenzai あり（模型あり）と なし（模型の場所を空にする）
          MODEL=$W/model.gguf; [ "${{ matrix.zen }}" = off ] && MODEL=""
          bash repo/tools/batch_convert.sh $E/session_handler_main $E "$MODEL" in.txt out/conv-${{ matrix.shard }}.tsv 4
          wc -l out/conv-${{ matrix.shard }}.tsv
      - uses: actions/upload-artifact@v4
        with:
          name: mine-conv-${{ inputs.bin_run || matrix.bin }}z${{ matrix.zen }}-${{ matrix.shard }}
          path: out/
          retention-days: 7

  # 一般的な IME との比べ: 上流の Mozc（Google 日本語入力の元。AI も CentaurIME の直しも入れない）で同じ文を変換する
  plain-mozc:
    if: false
    needs: sentences
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      USE_BAZEL_VERSION: 9.0.2
    steps:
      - uses: actions/checkout@v4
        with:
          path: repo
      - uses: actions/download-artifact@v4
        with:
          name: mine-sentences
          path: sentences
      - name: 上流の Mozc を組み立てる（myime の Mozc が上流から分かれた所の版、2026-08-27）
        run: |
          set -eo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq clang lld > /dev/null
          T=$HOME/tools; mkdir -p $T && ln -sf $(command -v ld.lld) $T/ld.lld
          curl -fsSL -o $T/bazelisk https://github.com/bazelbuild/bazelisk/releases/download/v1.25.0/bazelisk-linux-amd64
          chmod +x $T/bazelisk
          git clone -q https://github.com/google/mozc.git mozc
          git -C mozc checkout -q 4b1953a935c0613233f6f66c1799b827ddba7ca4
          git -C mozc submodule update -q --init --recursive
          cd mozc/src
          $T/bazelisk build --config oss_linux -c opt             --action_env=PATH=$T:/usr/bin:/bin --host_action_env=PATH=$T:/usr/bin:/bin             --linkopt=-B$T --host_linkopt=-B$T //converter:converter_main > $GITHUB_WORKSPACE/bazel.log 2>&1             || { grep -B3 -A20 "ERROR\|error:" $GITHUB_WORKSPACE/bazel.log | head -80; exit 1; }
      - name: 変換
        run: |
          set -eo pipefail
          mkdir -p out
          # converter_main は辞書（data_manager/oss/mozc.data）を今の場所から読むので、組み立ての付属の置き場で動かす
          D=$(dirname $(dirname $(dirname $(find -L mozc/src/bazel-bin/converter/converter_main.runfiles -path '*data_manager/oss/mozc.data' | head -1))))
          E=$GITHUB_WORKSPACE/mozc/src/bazel-bin/converter/converter_main
          cd $D
          python3 $GITHUB_WORKSPACE/repo/tools/mozc_plain_convert.py $E             $GITHUB_WORKSPACE/sentences/body.tsv $GITHUB_WORKSPACE/out/conv-plain.tsv
      - uses: actions/upload-artifact@v4
        with:
          name: mine-conv-plain-00
          path: out/
          retention-days: 7

  collect:
    needs: [convert]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: mine-sentences
          path: sentences
      - uses: actions/download-artifact@v4
        with:
          pattern: mine-conv-*
          path: conv
      - name: 元の文と違った文を集める（変換の一式ごと）
        run: |
          set -eo pipefail
          mkdir -p out
          for bin in $(ls conv | sed 's/^mine-conv-//; s/-[0-9]*$//' | sort -u); do
            cat conv/mine-conv-$bin-*/conv-*.tsv > out/converted-$bin.tsv
            echo "== 変換の一式 $bin" | tee -a out/summary.txt
            python3 tools/mine_mistakes.py sentences/body.tsv out/converted-$bin.tsv out/mistakes-$bin.tsv | tee -a out/summary.txt
          done
      - uses: actions/upload-artifact@v4
        with:
          name: mistakes
          path: out/
          retention-days: 14
